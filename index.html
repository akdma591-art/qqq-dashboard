<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QQQ Strategy Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b1020;
      color: #f5f7fb;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Arial, sans-serif;
    }

    .container {
      max-width: 720px;
      margin: auto;
      padding: 20px 16px 50px;
    }

    .header {
      text-align: center;
      margin: 12px 0 24px;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
    }

    .header p {
      color: #9ca8bd;
      margin-top: 8px;
    }

    .card {
      background: #151c2f;
      border: 1px solid #26304a;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 14px;
    }

    .center {
      text-align: center;
    }

    .state {
      font-size: 30px;
      font-weight: 800;
      margin: 10px 0;
    }

    .bull {
      color: #4ade80;
    }

    .bear {
      color: #fb7185;
    }

    .target {
      font-size: 27px;
      font-weight: 800;
      margin: 12px 0;
    }

    .action {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: 800;
      margin-top: 8px;
    }

    .no-trade {
      background: rgba(74,222,128,.14);
      color: #4ade80;
    }

    .trade {
      background: rgba(251,113,133,.15);
      color: #fb7185;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 11px 0;
      border-bottom: 1px solid #26304a;
    }

    .row:last-child {
      border-bottom: 0;
    }

    .label {
      color: #9ca8bd;
    }

    .value {
      font-weight: 700;
      text-align: right;
    }

    .section-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .chart {
      width: 100%;
      border-radius: 12px;
      margin-top: 10px;
    }

    .footer {
      text-align: center;
      color: #75829a;
      font-size: 12px;
      margin-top: 25px;
    }

    .loading {
      text-align: center;
      padding: 50px 10px;
      color: #9ca8bd;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>📊 QQQ Strategy</h1>
    <p id="signalDate">데이터 불러오는 중...</p>
  </div>

  <div id="dashboard" class="loading">
    대시보드 데이터를 불러오는 중입니다.
  </div>

</div>

<script>
async function loadDashboard() {

  try {

    const response = await fetch(
      "dashboard.json?t=" + new Date().getTime()
    );

    if (!response.ok) {
      throw new Error("dashboard.json 없음");
    }

    const d = await response.json();

    document.getElementById("signalDate").innerText =
      d.signal_date + " 종가 기준";

    const stateClass =
      d.state === "BULL" ? "bull" : "bear";

    const stateIcon =
      d.state === "BULL" ? "🟢" : "🔴";

    const actionClass =
      d.changed ? "trade" : "no-trade";

    const actionText =
      d.changed ? "🚨 매매 필요" : "✅ 매매 없음";

    document.getElementById("dashboard").className = "";

    document.getElementById("dashboard").innerHTML = `

      <div class="card center">

        <div class="label">시장 상태</div>

        <div class="state ${stateClass}">
          ${stateIcon} ${d.state}
        </div>

        <div class="label">현재 목표 포지션</div>

        <div class="target">
          ${d.target}
        </div>

        <div class="action ${actionClass}">
          ${actionText}
        </div>

      </div>


      

        <div class="section-title">
          📋 최근 포지션 변경
        </div>

        ${
          d.history && d.history.length > 0

          ? d.history.map((item, index) => `

              <div class="row">

                <span class="label">
                  ${item.date}
                  ${index === 0 ? " · 최근" : ""}
                </span>

                <span class="value">
                  ${item.target}
                </span>

              </div>

            `).join("")

          : `

              <div class="row">
                <span class="label">
                  기록
                </span>

                <span class="value">
                  아직 없음
                </span>
              </div>

            `
        }

      </div>


      

        <div class="section-title">
          시장 지표
        </div>

        <div class="row">
          <span class="label">QQQ</span>
          <span class="value">$${Number(d.qqq).toFixed(2)}</span>
        </div>

        <div class="row">
          <span class="label">MA250</span>
          <span class="value">$${Number(d.ma250).toFixed(2)}</span>
        </div>

        <div class="row">
          <span class="label">MA250 대비</span>
          <span class="value">${Number(d.ma_gap).toFixed(2)}%</span>
        </div>

        <div class="row">
          <span class="label">Bull 전환선 (+1%)</span>
          <span class="value">$${Number(d.upper).toFixed(2)}</span>
        </div>

        <div class="row">
          <span class="label">Bear 전환선 (-5%)</span>
          <span class="value">$${Number(d.lower).toFixed(2)}</span>
        </div>

        <div class="row">
          <span class="label">VIX</span>
          <span class="value">${Number(d.vix).toFixed(2)}</span>
        </div>

        <div class="row">
          <span class="label">VIX10</span>
          <span class="value">${Number(d.vix10).toFixed(2)}</span>
        </div>

        <div class="row">
          <span class="label">52주 고점</span>
          <span class="value">$${Number(d.high252).toFixed(2)}</span>
        </div>

        <div class="row">
          <span class="label">52주 Drawdown</span>
          <span class="value">${Number(d.drawdown).toFixed(2)}%</span>
        </div>

      </div>


      

        <div class="section-title">
          포지션
        </div>

        <div class="row">
          <span class="label">이전</span>
          <span class="value">${d.previous}</span>
        </div>

        <div class="row">
          <span class="label">현재</span>
          <span class="value">${d.target}</span>
        </div>

      </div>


      <div class="card">

        <div class="section-title">
          📈 QQQ 추세 / MA250
        </div>

        <div class="label">
          Bull +1% · Bear -5% 전환선
        </div>

        <img
          class="chart"
          src="qqq_ma250.png?t=${new Date().getTime()}"
          alt="QQQ MA250 Chart"
        >

      </div>


      <div class="card">

        <div class="section-title">
          ⚡ VIX 위험도
        </div>

        <div class="label">
          VIX10 기준 · 18 / 28 전략 임계값
        </div>

        <img
          class="chart"
          src="vix_vix10.png?t=${new Date().getTime()}"
          alt="VIX VIX10 Chart"
        >

      </div>


      <div class="card">

        <div class="section-title">
          📉 QQQ 52주 Drawdown
        </div>

        <div class="label">
          -9% 전략 위험 기준선
        </div>

        <img
          class="chart"
          src="qqq_drawdown.png?t=${new Date().getTime()}"
          alt="QQQ Drawdown Chart"
        >

      </div>


      <div class="footer">

        데이터 상태: ${d.data_status}<br><br>

        마지막 자동 업데이트<br>
        ${d.updated_at}

      </div>
    `;

  }

  catch(error) {

    document.getElementById("dashboard").innerHTML = `
      <div class="card center">
        ⚠️ 아직 대시보드 데이터가 없습니다.<br><br>
        다음 단계에서 자동 데이터를 연결합니다.
      </div>
    `;

  }
}

loadDashboard();
</script>

</body>
</html>
